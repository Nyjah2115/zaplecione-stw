<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sprawdzenie przeglądarki — Zaplecione_Stw</title>
<style>
  :root{ --paper:#FBF7F2; --ink:#2B211A; --line:#E4D8C9; --ok:#2E6B3E; --zle:#9B2C2C; }
  body{ margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 system-ui, sans-serif; padding:2rem 1rem; }
  main{ max-width:44rem; margin-inline:auto; }
  h1{ font-size:1.5rem; margin:0 0 .3rem; }
  p.wstep{ margin:0 0 2rem; color:#6E6157; }
  .rzad{ display:flex; justify-content:space-between; gap:1rem; align-items:baseline;
         padding:.85rem 0; border-bottom:1px solid var(--line); }
  .rzad b{ font-weight:600; }
  .ok{ color:var(--ok); font-weight:600; }
  .zle{ color:var(--zle); font-weight:600; }
  .rada{ margin-top:2rem; padding:1rem 1.2rem; border-left:3px solid var(--zle);
         background:#fff; display:none; }
  .rada.widoczna{ display:block; }
  .rada h2{ font-size:1.05rem; margin:0 0 .5rem; }
  .rada li{ margin-bottom:.4rem; }
  video{ width:1px; height:1px; opacity:0; position:absolute; }
</style>
</head>
<body>
<main>
  <h1>Co mówi ta przeglądarka</h1>
  <p class="wstep">Strona sprawdza ustawienia, które decydują o tym, czy animacje i wideo na
     <a href="./">stronie salonu</a> mają prawo zadziałać. Nic nie zapisuje ani nie wysyła.</p>
  <div id="wynik"></div>

  <div class="rada" id="rada">
    <h2>Znalazłem powód</h2>
    <div id="tresc-rady"></div>
  </div>
</main>

<video id="proba" muted playsinline preload="auto" src="media/hero/salon.mp4"></video>

<script>
(function(){
  var wynik = document.getElementById('wynik');
  function dodaj(nazwa, wartosc, dobrze){
    var d = document.createElement('div');
    d.className = 'rzad';
    d.innerHTML = '<span>' + nazwa + '</span><b class="' +
      (dobrze === null ? '' : (dobrze ? 'ok' : 'zle')) + '">' + wartosc + '</b>';
    wynik.appendChild(d);
    return d;
  }

  var powody = [];

  var ruch = matchMedia('(prefers-reduced-motion: reduce)').matches;
  dodaj('Ustawienie „ogranicz ruch” w systemie', ruch ? 'WŁĄCZONE' : 'wyłączone', !ruch);
  if (ruch) powody.push('<li><b>Masz włączone „ogranicz ruch”.</b> Strona celowo wyłącza wtedy wszystkie animacje i nie odtwarza wideo w tle. Windows: Ustawienia → Ułatwienia dostępu → Efekty wizualne → Efekty animacji. macOS: Ustawienia → Dostępność → Wyświetlacz → Ogranicz ruch.</li>');

  var hover = matchMedia('(hover: hover)').matches;
  dodaj('Kursor, którym da się najechać', hover ? 'tak' : 'nie (ekran dotykowy)', null);

  dodaj('Wersja arkusza, którą widzi przeglądarka', '<span id="wersja">sprawdzam…</span>', null);

  var v = document.getElementById('proba');
  var rzadWideo = dodaj('Odtwarzanie wideo w tle', 'sprawdzam…', null);
  var p = v.play();
  function wynikWideo(tekst, dobrze){
    rzadWideo.querySelector('b').textContent = tekst;
    rzadWideo.querySelector('b').className = dobrze ? 'ok' : 'zle';
  }
  if (p && p.then) {
    p.then(function(){ wynikWideo('działa', true); v.pause(); })
     .catch(function(e){
        wynikWideo('zablokowane (' + e.name + ')', false);
        powody.push('<li><b>Przeglądarka nie puściła wideo (' + e.name + ').</b> Jeśli ta karta jest w tle albo zminimalizowana, to normalne — wróć na nią i odśwież. Jeśli karta jest na wierzchu, blokuje to zwykle rozszerzenie oszczędzające dane albo ustawienie witryny: kliknij kłódkę obok adresu i sprawdź uprawnienia.</li>');
        pokazRade();
     });
  } else { wynikWideo('nie wiadomo', false); }

  // Dwa pobrania tego samego pliku: raz tak, jak zrobiłaby to przeglądarka
  // normalnie (może sięgnąć do pamięci podręcznej), raz z pominięciem pamięci.
  // Różne numery wersji znaczą, że w pamięci siedzi stara strona.
  Promise.all([
    fetch('index.html').then(function(r){ return r.text(); }),
    fetch('index.html', { cache: 'no-store' }).then(function(r){ return r.text(); })
  ]).then(function(obie){
    var wersja = function(t){ var m = t.match(/style\.css\?v=(\d+)/); return m ? m[1] : '?'; };
    var zPamieci = wersja(obie[0]), swieza = wersja(obie[1]);
    var el = document.getElementById('wersja');
    if (zPamieci === swieza) {
      el.textContent = 'aktualna (v=' + swieza + ')';
      el.className = 'ok';
    } else {
      el.textContent = 'STARA: v=' + zPamieci + ' zamiast v=' + swieza;
      el.className = 'zle';
      powody.push('<li><b>Przeglądarka trzyma starą wersję strony.</b> Odśwież z pominięciem pamięci: <b>Ctrl + Shift + R</b> (na Macu Cmd + Shift + R).</li>');
      pokazRade();
    }
  }).catch(function(){ document.getElementById('wersja').textContent = 'nie udało się sprawdzić'; });

  function pokazRade(){
    if (!powody.length) return;
    document.getElementById('tresc-rady').innerHTML = '<ul>' + powody.join('') + '</ul>';
    document.getElementById('rada').classList.add('widoczna');
  }
  setTimeout(pokazRade, 1200);
})();
</script>
</body>
</html>
